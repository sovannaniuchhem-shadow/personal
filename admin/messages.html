<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Messages · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%236366f1'/></svg>">
</head>
<body class="admin-body" data-page="messages">

  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="admin-main">
    <header class="topbar">
      <button class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="Open menu" data-icon="menu"></button>
      <h1 class="page-title">Messages</h1>
      <div class="topbar-actions">
        <a href="../index.html" class="view-site" target="_blank" rel="noopener"><span data-icon="globe"></span> <span>View Site</span></a>
        <button class="icon-btn" id="theme-toggle" title="Toggle theme" data-icon="sun"></button>
      </div>
    </header>

    <main class="admin-content">
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Contact Messages</h2>
            <p class="panel-sub">Sent from the contact form on your website</p>
          </div>
          <div class="panel-actions">
            <div class="search-box" style="max-width:260px;min-width:0">
              <input type="text" id="message-search" placeholder="Search messages...">
            </div>
            <div class="filter-chips" id="message-status-chips">
              <button class="chip active" data-status="">All</button>
              <button class="chip" data-status="unread">Unread</button>
              <button class="chip" data-status="read">Read</button>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Status</th>
                <th style="width:130px">Actions</th>
              </tr>
            </thead>
            <tbody id="messages-table-body"></tbody>
          </table>
        </div>
        <div class="hidden" id="messages-empty"></div>
      </div>
    </main>
  </div>

  <!-- Message view modal -->
  <div class="modal-backdrop hidden" id="message-modal">
    <div class="modal admin-modal">
      <div class="modal-head">
        <h3>Message</h3>
        <button class="close-btn" data-close="message-modal" aria-label="Close" data-icon="close"></button>
      </div>
      <div class="modal-body" id="message-modal-body"></div>
    </div>
  </div>

  <script src="../js/icons.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/messages.js"></script>
</body>
</html>
