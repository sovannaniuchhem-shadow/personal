<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%236366f1'/></svg>">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-logo" data-icon="lock"></div>
    <h1>Admin Login</h1>
    <p class="login-sub">Sign in to manage your portfolio</p>

    <div class="login-err" id="login-err"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="admin@example.com" autocomplete="username">
        <span class="error-msg">Please enter a valid email.</span>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="pwd-wrap">
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pwd-toggle" id="pwd-toggle" tabindex="-1" data-icon="eye"></button>
        </div>
        <span class="error-msg">Password is required.</span>
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-16" id="login-btn">Login →</button>
    </form>

    <!-- <div class="demo-creds">
      <strong>Demo credentials</strong><br>
      Email: <code>admin@example.com</code><br>
      Password: <code>Phantom</code>
    </div> -->
  </div>

  <a href="../index.html" class="btn btn-ghost btn-sm back-to-site"><span data-icon="arrow-left"></span> Back to site</a>

  <script src="../js/icons.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
